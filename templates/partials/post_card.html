<article class="post-card">

    <a href="{{ post.get_absolute_url }}" class="post-card-image" tabindex="-1" aria-hidden="true">
        {% if post.cover_image %}
        <img src="{{ post.cover_image.url }}" alt="" loading="lazy">
        {% else %}
        <span class="post-card-placeholder"><i class="fas fa-pen-nib"></i></span>
        {% endif %}
    </a>

    <div class="post-card-body">

        <div class="post-meta">
            <span>{{ post.published_at|date:"M d, Y" }}</span>
            <span>·</span>
            <span>{{ post.reading_time }} min read</span>
        </div>

        <h3><a href="{{ post.get_absolute_url }}">{{ post.title }}</a></h3>

        <p>{{ post.excerpt }}</p>

        <a href="{{ post.get_absolute_url }}" class="post-card-link">
            Read article <i class="fas fa-arrow-right"></i>
        </a>

    </div>

</article>
